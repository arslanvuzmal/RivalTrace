<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Briefing persistence and delivery architecture</title><desc id="desc">Structured insights are persisted, rendered through Jinja, attempted through Resend and Slack webhooks, and read by the portal.</desc>
  <defs><style>.h{font:700 19px Inter,Arial,sans-serif;fill:#f8fafc}.l{font:600 12px ui-monospace,monospace;letter-spacing:1.3px;fill:#94a3b8}.s{font:500 13px Inter,Arial,sans-serif;fill:#cbd5e1}.m{font:600 12px ui-monospace,monospace;fill:#e2e8f0}.c{fill:#0d1726;stroke:#334155}</style></defs>
  <rect width="1100" height="430" rx="22" fill="#08111f"/>
  <text x="50" y="48" class="l">PERSIST FIRST · DISTRIBUTE THROUGH ADAPTERS</text>
  <g transform="translate(50 92)"><rect width="235" height="235" rx="14" class="c"/><text x="22" y="38" class="l">STRUCTURED INSIGHT</text><text x="22" y="71" class="h">CompetitorInsight</text><text x="22" y="110" class="m">executive_summary</text><text x="22" y="137" class="m">what_changed[]</text><text x="22" y="164" class="m">what_it_means[]</text><text x="22" y="191" class="m">what_to_do[]</text><text x="22" y="218" class="m">threat_level</text></g>
  <path d="M300 210H357" stroke="#64748b" stroke-dasharray="5 5"/><path d="M349 204L357 210L349 216" fill="none" stroke="#64748b"/>
  <g transform="translate(372 92)"><rect width="250" height="235" rx="14" class="c"/><text x="22" y="38" class="l">MARKET MEMORY</text><text x="22" y="71" class="h">BriefingHistory</text><rect x="22" y="97" width="206" height="92" rx="9" fill="#111f31"/><text x="39" y="124" class="m">client_id</text><text x="39" y="148" class="m">competitor_id</text><text x="39" y="172" class="m">insight_json</text><text x="22" y="218" class="s">PostgreSQL JSONB variant</text></g>
  <path d="M638 210H695" stroke="#64748b" stroke-dasharray="5 5"/><path d="M687 204L695 210L687 216" fill="none" stroke="#64748b"/>
  <g transform="translate(710 76)">
    <rect width="340" height="267" rx="14" class="c"/><text x="22" y="38" class="l">CHANNEL ADAPTERS</text>
    <rect x="22" y="62" width="142" height="70" rx="9" fill="#111f31" stroke="#22d3ee"/><text x="38" y="89" class="h">Portal</text><text x="38" y="113" class="s">History read model</text>
    <rect x="176" y="62" width="142" height="70" rx="9" fill="#111f31" stroke="#f59e0b"/><text x="192" y="89" class="h">Email</text><text x="192" y="113" class="s">Jinja → Resend</text>
    <rect x="99" y="148" width="142" height="70" rx="9" fill="#111f31" stroke="#ef4444"/><text x="115" y="175" class="h">Slack</text><text x="115" y="199" class="s">Webhook + blocks</text>
    <text x="22" y="248" class="s">Channel calls return success/failure booleans.</text>
  </g>
  <text x="50" y="386" class="s">Briefing history records generated intelligence; channel delivery is attempted downstream.</text>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc">
  <title id="title">Snapshot delta architecture</title>
  <desc id="desc">Previous and current JSON snapshots are compared by DeepDiff and normalized into added, removed, and modified groups.</desc>
  <defs><style>
    .t{font:700 18px Inter,Arial,sans-serif;fill:#f8fafc}.l{font:600 12px ui-monospace,monospace;letter-spacing:1.4px;fill:#94a3b8}.s{font:500 13px Inter,Arial,sans-serif;fill:#cbd5e1}.m{font:600 12px ui-monospace,monospace;fill:#e2e8f0}.c{fill:#0d1726;stroke:#334155;stroke-width:1.2}
  </style></defs>
  <rect width="1100" height="410" rx="22" fill="#08111f"/>
  <text x="52" y="50" class="l">TEMPORAL COMPARISON</text>
  <g transform="translate(52 82)">
    <rect width="230" height="220" rx="14" class="c"/>
    <text x="22" y="38" class="l">SNAPSHOT t−1</text><text x="22" y="67" class="t">Previous state</text>
    <path d="M22 92H202M22 117H178M22 142H192M22 167H148" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <text x="22" y="201" class="m">raw_data · scrape_date</text>
  </g>
  <text x="310" y="195" class="t">+</text>
  <g transform="translate(350 82)">
    <rect width="230" height="220" rx="14" class="c"/>
    <text x="22" y="38" class="l">SNAPSHOT t</text><text x="22" y="67" class="t">Current state</text>
    <path d="M22 92H202M22 117H158" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <path d="M22 142H194M22 167H174" stroke="#22d3ee" stroke-width="8" stroke-linecap="round"/>
    <text x="22" y="201" class="m">raw_data · scrape_date</text>
  </g>
  <path d="M604 192H665" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/><path d="M655 184L665 192L655 200" fill="none" stroke="#64748b" stroke-width="2"/>
  <g transform="translate(688 82)">
    <rect width="360" height="220" rx="14" class="c"/>
    <text x="22" y="38" class="l">DEEPDIFF · ignore_order=true</text><text x="22" y="67" class="t">Normalized delta</text>
    <rect x="22" y="90" width="96" height="72" rx="10" fill="#0d2330" stroke="#22d3ee"/><text x="40" y="119" class="l">ADDED</text><text x="40" y="143" class="m">items</text>
    <rect x="132" y="90" width="96" height="72" rx="10" fill="#271719" stroke="#ef4444"/><text x="146" y="119" class="l">REMOVED</text><text x="150" y="143" class="m">items</text>
    <rect x="242" y="90" width="96" height="72" rx="10" fill="#2a2112" stroke="#f59e0b"/><text x="253" y="119" class="l">MODIFIED</text><text x="260" y="143" class="m">items</text>
    <text x="22" y="199" class="s">Dictionary, iterable, value, and type changes</text>
  </g>
  <path d="M52 345H1048" stroke="#1e293b"/><text x="52" y="375" class="s">First observation establishes a baseline; equivalent snapshots produce an empty delta.</text>
</svg>


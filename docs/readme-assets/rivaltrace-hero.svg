<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">RivalTrace competitive intelligence pipeline</title>
  <desc id="desc">Competitor observations become snapshots, structural deltas, strategic signals, briefing history, and channel delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.56" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.8px;fill:#94a3b8}
      .title{font:700 19px Inter,Arial,sans-serif;fill:#f8fafc}
      .small{font:500 13px Inter,Arial,sans-serif;fill:#cbd5e1}
      .mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e2e8f0}
      .card{fill:#0d1726;stroke:#26364b;stroke-width:1.2}
      .flow{fill:none;stroke:#475569;stroke-width:1.4;stroke-dasharray:5 6}
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <path d="M0 92H1200M0 468H1200" stroke="#1e293b"/>
  <path d="M92 0V560M1108 0V560" stroke="#172033"/>

  <g transform="translate(62 45)">
    <circle cx="25" cy="25" r="22" fill="none" stroke="#334155"/>
    <circle cx="25" cy="25" r="13" fill="none" stroke="#22d3ee" stroke-opacity=".7"/>
    <path d="M25 25L42 10M25 25H48" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="25" cy="25" r="3.5" fill="#f8fafc"/>
  </g>
  <text x="125" y="67" class="title" font-size="24">RivalTrace</text>
  <text x="1015" y="65" class="label">STATE → SIGNAL</text>

  <g transform="translate(65 130)">
    <text x="0" y="0" class="label">01 · OBSERVE</text>
    <rect y="20" width="190" height="254" rx="15" class="card"/>
    <text x="22" y="55" class="title">Competitor state</text>
    <g transform="translate(20 78)">
      <rect width="150" height="43" rx="8" fill="#111f31" stroke="#2d4158"/>
      <circle cx="18" cy="21.5" r="5" fill="#22d3ee"/>
      <text x="33" y="26" class="small">Competitor A</text>
      <rect y="53" width="150" height="43" rx="8" fill="#111f31" stroke="#2d4158"/>
      <circle cx="18" cy="74.5" r="5" fill="#38bdf8"/>
      <text x="33" y="79" class="small">Competitor B</text>
      <rect y="106" width="150" height="43" rx="8" fill="#111f31" stroke="#2d4158"/>
      <circle cx="18" cy="127.5" r="5" fill="#60a5fa"/>
      <text x="33" y="132" class="small">Competitor C</text>
    </g>
    <text x="22" y="251" class="mono">Apify actor output</text>
  </g>

  <path d="M260 277H302" class="flow"/>
  <path d="M294 271L302 277L294 283" fill="none" stroke="#64748b"/>

  <g transform="translate(310 130)">
    <text x="0" y="0" class="label">02 · PRESERVE + COMPARE</text>
    <rect y="20" width="258" height="254" rx="15" class="card"/>
    <text x="22" y="55" class="title">Temporal snapshots</text>
    <g transform="translate(22 78)">
      <rect x="0" y="16" width="88" height="74" rx="8" fill="#101c2c" stroke="#334155"/>
      <text x="15" y="45" class="mono">t−1</text>
      <path d="M15 58H72M15 68H61" stroke="#475569"/>
      <rect x="112" width="88" height="90" rx="8" fill="#111f31" stroke="#22d3ee"/>
      <text x="127" y="34" class="mono">t</text>
      <path d="M127 48H184M127 58H175M127 68H184" stroke="#64748b"/>
      <path d="M92 45H106" stroke="#f59e0b" stroke-width="2"/>
    </g>
    <rect x="22" y="187" width="214" height="56" rx="9" fill="#101c2c" stroke="#334155"/>
    <text x="38" y="211" class="label">DEEPDIFF</text>
    <text x="38" y="231" class="mono">added · removed · modified</text>
  </g>

  <path d="M574 277H616" class="flow"/>
  <path d="M608 271L616 277L608 283" fill="none" stroke="#64748b"/>

  <g transform="translate(624 130)">
    <text x="0" y="0" class="label">03 · INTERPRET</text>
    <rect y="20" width="258" height="254" rx="15" class="card"/>
    <text x="22" y="55" class="title">Structured signal</text>
    <g transform="translate(22 78)">
      <rect width="214" height="44" rx="8" fill="#101c2c" stroke="#22d3ee" stroke-opacity=".7"/>
      <text x="15" y="18" class="label">WHAT CHANGED</text>
      <text x="15" y="35" class="small">Observed delta</text>
      <rect y="54" width="214" height="44" rx="8" fill="#101c2c" stroke="#f59e0b" stroke-opacity=".8"/>
      <text x="15" y="72" class="label">WHAT IT MEANS</text>
      <text x="15" y="89" class="small">Model interpretation</text>
      <rect y="108" width="214" height="44" rx="8" fill="#101c2c" stroke="#ef4444" stroke-opacity=".8"/>
      <text x="15" y="126" class="label">WHAT TO DO</text>
      <text x="15" y="143" class="small">Recommended attention</text>
    </g>
    <text x="22" y="251" class="mono">Pydantic-validated JSON</text>
  </g>

  <path d="M888 277H930" class="flow"/>
  <path d="M922 271L930 277L922 283" fill="none" stroke="#64748b"/>

  <g transform="translate(938 130)">
    <text x="0" y="0" class="label">04 · REMEMBER + DISTRIBUTE</text>
    <rect y="20" width="197" height="254" rx="15" class="card"/>
    <text x="21" y="55" class="title">Market memory</text>
    <path d="M35 87V181" stroke="#475569" stroke-width="2"/>
    <circle cx="35" cy="96" r="5" fill="#22d3ee"/>
    <circle cx="35" cy="134" r="5" fill="#f59e0b"/>
    <circle cx="35" cy="172" r="5" fill="#ef4444"/>
    <text x="53" y="101" class="small">Briefing 01</text>
    <text x="53" y="139" class="small">Briefing 02</text>
    <text x="53" y="177" class="small">Briefing 03</text>
    <rect x="21" y="204" width="46" height="31" rx="7" fill="#111f31" stroke="#334155"/>
    <rect x="76" y="204" width="46" height="31" rx="7" fill="#111f31" stroke="#334155"/>
    <rect x="131" y="204" width="46" height="31" rx="7" fill="#111f31" stroke="#334155"/>
    <text x="30" y="224" class="mono">WEB</text>
    <text x="84" y="224" class="mono">MAIL</text>
    <text x="137" y="224" class="mono">SLACK</text>
  </g>

  <path d="M144 447H1056" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <text x="144" y="481" class="label">OBSERVATION</text>
  <text x="479" y="481" class="label">STRUCTURAL CHANGE</text>
  <text x="827" y="481" class="label">STRATEGIC SIGNAL</text>
  <text x="144" y="515" class="small">The language model interprets a bounded delta—not an undifferentiated page dump.</text>
</svg>


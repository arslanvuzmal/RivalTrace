<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a competitor change</title>
  <desc id="desc">An illustrative before and after value becomes a deterministic values_changed record and then a model interpretation.</desc>
  <defs><style>.h{font:700 19px Inter,Arial,sans-serif;fill:#f8fafc}.l{font:600 12px ui-monospace,monospace;letter-spacing:1.3px;fill:#94a3b8}.s{font:500 14px Inter,Arial,sans-serif;fill:#cbd5e1}.m{font:600 12px ui-monospace,monospace;fill:#e2e8f0}.c{fill:#0d1726;stroke:#334155}</style></defs>
  <rect width="1100" height="420" rx="22" fill="#08111f"/>
  <text x="50" y="47" class="l">ILLUSTRATIVE SIGNAL · NOT A BENCHMARK</text>
  <g transform="translate(50 78)"><rect width="265" height="220" rx="14" class="c"/><text x="22" y="38" class="l">BEFORE · t−1</text><text x="22" y="76" class="h">Plan copy</text><rect x="22" y="100" width="221" height="73" rx="9" fill="#111f31"/><text x="38" y="128" class="s">“Enterprise includes</text><text x="38" y="151" class="s">10 seats.”</text><text x="22" y="203" class="m">snapshot.raw_data</text></g>
  <g transform="translate(348 78)"><rect width="265" height="220" rx="14" class="c"/><text x="22" y="38" class="l">AFTER · t</text><text x="22" y="76" class="h">Plan copy</text><rect x="22" y="100" width="221" height="73" rx="9" fill="#111f31" stroke="#f59e0b"/><text x="38" y="128" class="s">“Enterprise includes</text><text x="38" y="151" class="s">25 seats.”</text><text x="22" y="203" class="m">snapshot.raw_data</text></g>
  <path d="M630 188H675" stroke="#64748b" stroke-dasharray="5 5"/><path d="M667 182L675 188L667 194" fill="none" stroke="#64748b"/>
  <g transform="translate(690 78)"><rect width="360" height="220" rx="14" class="c"/><text x="22" y="38" class="l">STRUCTURAL DELTA</text><text x="22" y="72" class="h">values_changed</text><rect x="22" y="94" width="316" height="82" rx="9" fill="#111f31"/><text x="38" y="120" class="m">path: root['plan']['seats']</text><text x="38" y="143" class="m">old_value: 10</text><text x="38" y="164" class="m">new_value: 25</text><text x="22" y="205" class="s">Observed by deterministic comparison</text></g>
  <path d="M180 335H920" stroke="#334155" stroke-width="2"/><circle cx="550" cy="335" r="6" fill="#22d3ee"/><text x="50" y="374" class="l">EVIDENCE</text><text x="465" y="374" class="l">SANITIZE</text><text x="875" y="374" class="l">INTERPRETATION</text>
</svg>

